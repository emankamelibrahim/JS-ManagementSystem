<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="icon" type="image/png" href="../resources/icon/website-icon-blue.png">
  <link rel="stylesheet" href="./Style/auth.css"/>
  <link rel="stylesheet" href="./Style/colour-pallette.css/blues.css"/>


</head>
<body>
  <div class="container">
    <div class="container-elements">

    <h1>Login</h1>
    <form id="authForm">
    <label>Username</label>
    <input type="text" id="username" placeholder="Username" required>
    <br>
    <label>Password</label>
    <input type="password" id="password" placeholder="Password" required>
    <br>
    <button type="submit">Login</button>
    </div>
  </form>
    </div>

  <script src="auth/CookiesLibrary.js"></script>
  <script src="auth/login.js"></script>
</body>
</html>
